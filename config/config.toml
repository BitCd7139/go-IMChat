[mainConfig]
appName = "IMChat"
host = "0.0.0.0"
port = 8000
serverId = 1

[mysqlConfig]
host = "localhost"
port = 3306
username = "root"
password = "123456"
database = "im_chat"

[redisConfig]
host = "localhost"
port = 6379
password = ""
db = 0

[kafkaConfig]
# messageMode: channel (单机), redis_pubsub (多节点), kafka
messageMode = "channel"
hostPort = "localhost:9092"
loginTopic = "login"
chatTopic = "chat"
logoutTopic = "logout"
partitions = 1
timeout = 1

[staticSrcConfig]
staticAvatarPath = "./static/avatars"
staticFilePath = "./static/files"

[logConfig]
logLevel = "debug"
logPath = "./logs/app.log"